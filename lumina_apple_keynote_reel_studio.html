<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veyraq Apple Keynote Reel Studio — 30s 9:16 Video Engine | Made by Tafeem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,700;1,800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-studio: #09090D;
      --glass-hud: rgba(20, 20, 27, 0.84);
      --glass-border: rgba(255, 255, 255, 0.14);
      --coral: #FF5436;
      --coral-soft: #FF8A6E;
      --cobalt: #25529B;
      --apple-ease: cubic-bezier(0.28, 0.11, 0.32, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 15%, #1D1518 0%, #09090D 60%, #050507 100%);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Top Minimal Floating Glass HUD */
    #top-hud {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 7px 15px;
      border-radius: 999px;
      background: var(--glass-hud);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.52);
      transition: opacity 0.35s var(--apple-ease), transform 0.35s var(--apple-ease);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 0 0 12px var(--coral);
      animation: pulseDot 1.8s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: 0.55; }
    }

    .hud-pill-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s var(--apple-ease);
    }

    .hud-pill-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    .hud-pill-coral {
      background: linear-gradient(135deg, #FF684D 0%, #FF5436 100%);
      border-color: rgba(255, 255, 255, 0.28);
      box-shadow: 0 6px 18px rgba(255, 84, 54, 0.38);
    }

    /* 9:16 Viewport Stage */
    #stage-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      padding: 58px 14px 104px;
      transition: padding 0.35s var(--apple-ease);
    }

    #canvas-shell {
      position: relative;
      aspect-ratio: 9 / 16;
      height: 100%;
      max-height: calc(100vh - 164px);
      max-width: calc(100vw - 28px);
      border-radius: 28px;
      overflow: hidden;
      background: #FFFFFF;
      box-shadow:
        0 34px 95px rgba(0, 0, 0, 0.85),
        0 0 0 1px rgba(255, 255, 255, 0.18);
      transition: all 0.35s var(--apple-ease);
    }

    #reel-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #drop-zone {
      position: absolute;
      inset: 0;
      z-index: 30;
      background: rgba(10, 10, 14, 0.86);
      backdrop-filter: blur(14px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      border: 2px dashed var(--coral);
      border-radius: 28px;
    }

    #drop-zone.active {
      display: flex;
    }

    /* Bottom Glass Control Dock with Timeline Scrubber */
    #bottom-hud {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      width: min(860px, calc(100vw - 20px));
      padding: 10px 16px;
      border-radius: 22px;
      background: var(--glass-hud);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: opacity 0.35s var(--apple-ease), transform 0.35s var(--apple-ease);
    }

    .scrubber-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .time-label {
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, 0.78);
      min-width: 72px;
    }

    input[type="range"]#timeline-scrubber {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]#timeline-scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--coral);
      border: 2px solid #FFFFFF;
      box-shadow: 0 2px 10px rgba(255, 84, 54, 0.65);
      cursor: pointer;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .dock-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s var(--apple-ease);
      white-space: nowrap;
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .dock-btn-export {
      background: linear-gradient(135deg, #FF6B4A 0%, #D92B1C 100%);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 22px rgba(255, 84, 54, 0.4);
      font-weight: 800;
    }

    .dock-btn-export:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .act-pills {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px;
      border-radius: 11px;
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .act-pill {
      appearance: none;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.65);
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .act-pill.active {
      background: var(--coral);
      color: #FFFFFF;
      box-shadow: 0 2px 10px rgba(255, 84, 54, 0.45);
    }

    /* Clean Screen-Record Mode ('H' key) */
    body.clean-mode #top-hud,
    body.clean-mode #bottom-hud {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(14px);
    }

    body.clean-mode #stage-wrap {
      padding: 12px;
    }

    body.clean-mode #canvas-shell {
      max-height: calc(100vh - 24px);
      border-radius: 18px;
    }

    /* Export Progress Overlay */
    #export-overlay {
      position: fixed;
      top: 62px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: none;
      align-items: center;
      gap: 12px;
      padding: 9px 18px;
      border-radius: 999px;
      background: rgba(16, 16, 22, 0.95);
      border: 1px solid rgba(255, 84, 54, 0.55);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      font-size: 12px;
      font-weight: 700;
    }

    #export-overlay.visible {
      display: flex;
    }

    #export-track {
      width: 120px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }

    #export-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #FF8A6E, #FF5436);
      border-radius: 999px;
    }

    /* Toast */
    #toast {
      position: fixed;
      top: 62px;
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      z-index: 60;
      padding: 8px 18px;
      border-radius: 999px;
      background: #1C1C24;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <input type="file" id="file-picker" accept="image/*" multiple style="display:none" />

  <!-- Top Minimal Glass HUD -->
  <div id="top-hud">
    <div style="display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;">
      <span class="status-dot"></span>
      <span>Veyraq Apple Keynote Reel Studio · 30s (9:16)</span>
    </div>
    <button type="button" id="btn-load-shots" class="hud-pill-btn hud-pill-coral">
      📁 Load 7 Screenshots
    </button>
    <span id="shots-status" style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.7);">
      Vector UI Ready
    </span>
  </div>

  <!-- Export Progress Pill -->
  <div id="export-overlay">
    <span class="status-dot"></span>
    <span>Exporting 30s 1080×1920 60fps Video...</span>
    <div id="export-track"><div id="export-fill"></div></div>
    <span id="export-pct">0%</span>
  </div>

  <!-- Toast Banner -->
  <div id="toast"></div>

  <!-- Center 9:16 Stage -->
  <div id="stage-wrap">
    <div id="canvas-shell">
      <canvas id="reel-canvas" width="1080" height="1920"></canvas>
      <div id="drop-zone">
        <div style="font-size:44px;margin-bottom:10px;">📸</div>
        <div style="font-size:19px;font-weight:900;margin-bottom:6px;">Drop Up To 7 Veyraq Screenshots</div>
        <div style="font-size:12px;color:rgba(255,255,255,0.72);max-width:260px;">
          Injects directly into the 30-second Apple Keynote 1080×1920 showcase.
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Timeline & Studio Dock -->
  <div id="bottom-hud">
    <div class="scrubber-row">
      <span class="time-label" id="time-display">00.0s / 30.0s</span>
      <input type="range" id="timeline-scrubber" min="0" max="30000" step="10" value="0" />
      <span class="time-label" id="act-name-display" style="text-align:right;color:#FF8A6E;">Act 1 · Hook</span>
    </div>

    <div class="controls-row">
      <div class="btn-group">
        <button type="button" id="btn-play" class="dock-btn">❚❚ Pause</button>
        <button type="button" id="btn-restart" class="dock-btn">↻ Restart</button>
        <div class="act-pills" title="Jump to Act">
          <button type="button" class="act-pill active" data-act="0">Act 1</button>
          <button type="button" class="act-pill" data-act="1">Act 2</button>
          <button type="button" class="act-pill" data-act="2">Act 3</button>
          <button type="button" class="act-pill" data-act="3">Act 4</button>
          <button type="button" class="act-pill" data-act="4">Act 5</button>
          <button type="button" class="act-pill" data-act="5">Act 6</button>
        </div>
      </div>

      <div class="btn-group">
        <button type="button" id="btn-synth" class="dock-btn">♪ Maj9 Synth: On</button>
        <button type="button" id="btn-hide" class="dock-btn">⛶ Hide HUD (H)</button>
        <button type="button" id="btn-export" class="dock-btn dock-btn-export">⬇ Export 30s 1080×1920 Video (.webm)</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('reel-canvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const W = 1080;
      const H = 1920;

      const ACT_DURATION = 5000; // 5.0 seconds per act
      const TOTAL_ACTS = 6;
      const TOTAL_DURATION = ACT_DURATION * TOTAL_ACTS; // 30.0 seconds

      const ACT_LABELS = [
        'Act 1 · Hook',
        'Act 2 · Editorial',
        'Act 3 · 8 Styles',
        'Act 4 · Lyrics',
        'Act 5 · Icons',
        'Act 6 · CTA'
      ];

      let elapsed = 0;
      let isPlaying = true;
      let isExporting = false;
      let lastNow = performance.now();

      const toastEl = document.getElementById('toast');
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastEl._tid);
        toastEl._tid = setTimeout(() => toastEl.classList.remove('show'), 2800);
      }

      // =========================================================================
      // 1. APPLE KEYNOTE CUBIC-BEZIER & SPRING PHYSICS
      // =========================================================================
      // True Apple Keynote cubic-bezier(0.28, 0.11, 0.32, 1) solver
      function appleKeynoteEase(t) {
        const x = Math.max(0, Math.min(1, t));
        // Analytical high-precision approximation of cubic-bezier(0.28, 0.11, 0.32, 1)
        const p1 = 0.11, p2 = 1.0;
        const u = 1 - x;
        return 3 * u * u * x * p1 + 3 * u * x * x * p2 + x * x * x;
      }

      function appleSpring(t) {
        const x = Math.max(0, Math.min(1, t));
        if (x === 0 || x === 1) return x;
        return 1 - Math.cos(x * Math.PI * 1.5) * Math.exp(-5.2 * x);
      }

      // =========================================================================
      // 2. SCREENSHOT AUTO-LOADER + FILE PICKER + DRAG-AND-DROP
      // =========================================================================
      const loadedShots = [];
      const shotsStatusEl = document.getElementById('shots-status');

      const autoProbeNames = [
        '50-player-hero.jpg',
        '03-player-editorial.jpg',
        '28-settings-player-styles-scrolled.jpg',
        '09-player-style-wheel.jpg',
        '07-search-music-songs.jpg',
        '27-settings-player-styles.jpg',
        '01-home-music-your-mix.jpg',
        '50-player-hero.png',
        '03-player-editorial.png',
        '27-settings-player-styles.png',
        '28-settings-player-styles-scrolled.png',
        '09-player-style-wheel.png',
        '07-search-music-songs.png',
        '01-home-music-your-mix.png'
      ];

      function refreshShotsBadge() {
        if (loadedShots.length > 0) {
          shotsStatusEl.textContent = `${loadedShots.length} Real Screenshot${loadedShots.length > 1 ? 's' : ''} Active`;
          shotsStatusEl.style.color = '#FF8A6E';
        } else {
          shotsStatusEl.textContent = 'Vector UI Ready';
          shotsStatusEl.style.color = 'rgba(255,255,255,0.7)';
        }
      }

      autoProbeNames.forEach((src) => {
        const img = new Image();
        img.onload = () => {
          if (loadedShots.length < 7 && !loadedShots.some(s => s.src === img.src)) {
            loadedShots.push(img);
            refreshShotsBadge();
          }
        };
        img.src = src;
      });

      async function ingestFiles(fileList) {
        const files = Array.from(fileList).filter(f => f.type.startsWith('image/')).slice(0, 7);
        if (!files.length) return;
        loadedShots.length = 0;
        const decoded = await Promise.all(files.map(async (f) => {
          const img = new Image();
          img.src = URL.createObjectURL(f);
          if (img.decode) {
            try { await img.decode(); } catch (_) {}
          } else {
            await new Promise(r => { img.onload = r; img.onerror = r; });
          }
          return img;
        }));
        loadedShots.push(...decoded);
        refreshShotsBadge();
        renderFrame(elapsed);
        showToast(`Instant Loaded ${loadedShots.length} screenshot${loadedShots.length > 1 ? 's' : ''}!`);
      }

      const filePicker = document.getElementById('file-picker');
      document.getElementById('btn-load-shots').addEventListener('click', () => filePicker.click());
      filePicker.addEventListener('change', (e) => ingestFiles(e.target.files));

      const canvasShell = document.getElementById('canvas-shell');
      const dropZone = document.getElementById('drop-zone');
      ['dragenter', 'dragover'].forEach(ev => {
        canvasShell.addEventListener(ev, (e) => {
          e.preventDefault();
          dropZone.classList.add('active');
        });
      });
      ['dragleave', 'drop'].forEach(ev => {
        canvasShell.addEventListener(ev, (e) => {
          e.preventDefault();
          dropZone.classList.remove('active');
        });
      });
      canvasShell.addEventListener('drop', (e) => {
        if (e.dataTransfer && e.dataTransfer.files) ingestFiles(e.dataTransfer.files);
      });

      // =========================================================================
      // 3. BUILT-IN ULTRA-HIGH-CRAFT VECTOR UI MOCKUPS (10/10 OUT OF THE BOX)
      // =========================================================================
      const vectorMockups = [];

      function buildVectorMockups() {
        const screens = [
          // 0: Editorial Player (Act 2)
          {
            bg: '#E9EEF7', ink: '#25529B', badge: 'Editorial Player',
            title: 'Espresso', sub: 'SABRINA CARPENTER',
            scallop: true, artGrad: ['#1D4ED8', '#25529B', '#60A5FA'],
            rows: ['12-Point Scalloped Art', 'Wavy Harmonic Seekbar', 'iOS 26 AGSL Refraction']
          },
          // 1: 8 Expressive Styles Grid (Act 3 Left)
          {
            bg: '#FFF8F6', ink: '#2D1814', badge: '8 Player Styles',
            title: 'Player', sub: 'LONG-PRESS WHEEL TO MORPH',
            scallop: false, artGrad: ['#FF684D', '#FF5436', '#9E160E'],
            rows: ['Editorial & Classic', 'Bento & Rotary Dial', 'Gesture · Sticker · Morph']
          },
          // 2: Adaptive Cover Colors (Act 3 Right)
          {
            bg: '#F5F5F7', ink: '#1D1D1F', badge: 'Dynamic Tinting',
            title: 'Adaptive UI', sub: 'REAL-TIME PALETTE EXTRACTION',
            scallop: false, artGrad: ['#25529B', '#3B82F6', '#93C5FD'],
            rows: ['Album Art Color Engine', '120Hz Spring Transitions', 'Liquid Glass Controls']
          },
          // 3: Synced Lyrics (Act 4 Left - Dark)
          {
            bg: '#16171C', ink: '#FFFFFF', badge: 'Live Lyrics',
            title: 'KALYANI', sub: 'ARJN, KDS, FIFTY4, RONN',
            scallop: false, artGrad: ['#FF5436', '#B91C1C', '#18181B'],
            rows: ['അവളുടെ കരിമഷി മിഴിയുണ്ടല്ലോ', 'Romanized & Native Lyrics', 'Zero-Latency Word Sync']
          },
          // 4: Up Next Queue (Act 4 Right - Dark)
          {
            bg: '#1A1B20', ink: '#FFFFFF', badge: 'Up Next Queue',
            title: 'Up Next', sub: '10 TRACKS · DRAG TO REORDER',
            scallop: false, artGrad: ['#25529B', '#1E3A8A', '#0F172A'],
            rows: ['1 · KALYANI (Remix)', '2 · Thodi Si Daaru — AP Dhillon', '3 · Nenjakam — ARJN, KDS']
          },
          // 5: Custom App Icons (Act 5 Left)
          {
            bg: '#F3ECE0', ink: '#2D1814', badge: '6 App Icons',
            title: 'App Icon', sub: 'SQUIRCLE · CIRCLE · BURST',
            scallop: true, artGrad: ['#FF5436', '#14141A', '#FF8A6E'],
            rows: ['Veyraq Classic (Active)', 'Crimson Beat & Midnight Cyber', 'Emerald Groove & Sunset']
          },
          // 6: Library & Offline Hub (Act 5 Right)
          {
            bg: '#FFFFFF', ink: '#1D1D1F', badge: 'Offline Hub',
            title: 'Library', sub: 'READY OFFLINE · ZERO ADS',
            scallop: false, artGrad: ['#1D1D1F', '#FF5436', '#FF9E88'],
            rows: ['Downloads & Ready Offline', 'Listening History & Your Mix', 'Floating Frosted Glass Dock']
          }
        ];

        screens.forEach((sc) => {
          const off = document.createElement('canvas');
          off.width = 540;
          off.height = 1170;
          const c = off.getContext('2d');

          c.fillStyle = sc.bg;
          c.fillRect(0, 0, 540, 1170);

          // Top status header
          roundRect(c, 36, 54, 46, 46, 23);
          c.fillStyle = sc.ink === '#FFFFFF' ? 'rgba(255,255,255,0.14)' : 'rgba(0,0,0,0.07)';
          c.fill();

          roundRect(c, 326, 54, 178, 46, 23);
          c.fillStyle = '#FF5436';
          c.fill();
          c.fillStyle = '#FFFFFF';
          c.font = '800 17px Inter, sans-serif';
          c.textAlign = 'center';
          c.fillText(sc.badge, 415, 83);

          // Artwork Shape
          c.save();
          c.translate(270, 345);
          if (sc.scallop) {
            scallopedStarPath(c, 0, 0, 168, 140, 12);
          } else {
            roundRect(c, -155, -155, 310, 310, 56);
          }
          const ag = c.createLinearGradient(-155, -155, 155, 155);
          ag.addColorStop(0, sc.artGrad[0]);
          ag.addColorStop(0.55, sc.artGrad[1]);
          ag.addColorStop(1, sc.artGrad[2]);
          c.fillStyle = ag;
          c.fill();

          c.fillStyle = 'rgba(255,255,255,0.92)';
          c.font = '900 94px Inter, sans-serif';
          c.textAlign = 'center';
          c.fillText('♪', 0, 34);
          c.restore();

          // Editorial Title
          c.textAlign = 'left';
          c.fillStyle = sc.ink;
          c.font = sc.scallop ? 'italic 800 60px "Playfair Display", Georgia, serif' : '900 50px Inter, sans-serif';
          c.fillText(sc.title, 42, 600);

          c.fillStyle = sc.ink === '#FFFFFF' ? 'rgba(255,255,255,0.62)' : 'rgba(29,29,31,0.58)';

      // =========================================================================
      // 4. DRAWING PRIMITIVES (3D EMBLEM, TITANIUM PHONE, LIQUID GLASS PILLS)
      // =========================================================================
      function roundRect(c, x, y, w, h, r) {
        const rad = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + rad, y);
        c.arcTo(x + w, y, x + w, y + h, rad);
        c.arcTo(x + w, y + h, x, y + h, rad);
        c.arcTo(x, y + h, x, y, rad);
        c.arcTo(x, y, x + w, y, rad);
        c.closePath();
      }

      function scallopedStarPath(c, cx, cy, outerR, innerR, points) {
        c.beginPath();
        const total = points * 2;
        for (let i = 0; i <= total; i++) {
          const a = (i * Math.PI) / points - Math.PI / 2;
          const r = i % 2 === 0 ? outerR : innerR;
          const px = cx + Math.cos(a) * r;
          const py = cy + Math.sin(a) * r;
          if (i === 0) c.moveTo(px, py);
          else c.lineTo(px, py);
        }
        c.closePath();
      }

      // 3D Titanium-White / Obsidian Smartphone Frame
      function drawPhoneMockup(c, imgSource, opts) {
        const {
          cx, cy, width, height,
          tiltDeg = 0, scale = 1, alpha = 1,
          darkBezel = false, glare = 0.5
        } = opts;

        c.save();
        c.globalAlpha = alpha;
        c.translate(cx, cy);
        c.rotate((tiltDeg * Math.PI) / 180);
        c.scale(scale, scale);

        const x = -width / 2;
        const y = -height / 2;
        const radius = 66;

        // Soft Apple Contact Shadow
        c.save();
        c.shadowColor = darkBezel ? 'rgba(0, 0, 0, 0.82)' : 'rgba(29, 29, 31, 0.22)';
        c.shadowBlur = 80;
        c.shadowOffsetY = 36;
        roundRect(c, x, y, width, height, radius);
        c.fillStyle = darkBezel ? '#14141B' : '#FFFFFF';
        c.fill();
        c.restore();

        // Titanium Bezel Gradient
        roundRect(c, x, y, width, height, radius);
        const bezel = c.createLinearGradient(x, y, x + width, y + height);
        if (darkBezel) {
          bezel.addColorStop(0, '#4A4D5C');
          bezel.addColorStop(0.5, '#1B1C24');
          bezel.addColorStop(1, '#343744');
        } else {
          bezel.addColorStop(0, '#FFFFFF');
          bezel.addColorStop(0.5, '#E8EAEE');
          bezel.addColorStop(1, '#D1D5DF');
        }
        c.fillStyle = bezel;
        c.fill();

        // Outer Hairline Rim
        roundRect(c, x, y, width, height, radius);
        c.lineWidth = 2;
        c.strokeStyle = darkBezel ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.08)';
        c.stroke();

        // Inner Screen Clip
        const pad = 16;
        const sx = x + pad;
        const sy = y + pad;
        const sw = width - pad * 2;
        const sh = height - pad * 2;
        const sr = radius - 13;

        c.save();
        roundRect(c, sx, sy, sw, sh, sr);
        c.clip();

        // Aspect-fill draw image
        const iw = imgSource.width || 540;
        const ih = imgSource.height || 1170;
        const imgRatio = iw / ih;
        const boxRatio = sw / sh;
        let dw = sw, dh = sh, dx = sx, dy = sy;
        if (imgRatio > boxRatio) {
          dw = sh * imgRatio;
          dx = sx - (dw - sw) / 2;
        } else {
          dh = sw / imgRatio;
          dy = sy - (dh - sh) / 2;
        }
        c.drawImage(imgSource, dx, dy, dw, dh);

        // Specular Glass Glare Sweep
        const gx = sx - sw + glare * (sw * 2.6);
        const gg = c.createLinearGradient(gx, sy, gx + sw * 0.65, sy + sh * 0.5);
        gg.addColorStop(0, 'rgba(255,255,255,0)');
        gg.addColorStop(0.5, 'rgba(255,255,255,0.24)');
        gg.addColorStop(1, 'rgba(255,255,255,0)');
        c.fillStyle = gg;
        c.fillRect(sx, sy, sw, sh);

        c.restore();
        c.restore();
      }

      // ON-TOP Floating Liquid Glass Callout Pill
      function drawGlassPill(c, opts) {
        const {

        const sw = subtitle ? c.measureText(subtitle).width * 0.78 : 0;
        const pw = Math.max(tw, sw) + 116;
        const ph = subtitle ? 94 : 74;
        const x = -pw / 2;
        const y = -ph / 2;

        // Shadow
        c.save();
        c.shadowColor = dark ? 'rgba(0,0,0,0.68)' : 'rgba(29,29,31,0.14)';
        c.shadowBlur = 34;
        c.shadowOffsetY = 14;
        roundRect(c, x, y, pw, ph, ph / 2);

        } else {
          c.fillStyle = dark ? 'rgba(22, 22, 30, 0.9)' : 'rgba(255, 255, 255, 0.94)';
        }
        c.fill();
        c.restore();

        roundRect(c, x, y, pw, ph, ph / 2);

          ? 'rgba(255,255,255,0.65)'
          : (dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,1)');
        c.stroke();

        // Accent Indicator Dot
        c.beginPath();
        c.arc(x + 42, 0, 14, 0, Math.PI * 2);
        c.fillStyle = activeHighlight ? '#FFFFFF' : accent;
        c.fill();

        c.beginPath();
        c.arc(x + 42, 0, 5.5, 0, Math.PI * 2);

        c.fill();

        // Typography
        c.textAlign = 'left';
        c.fillStyle = activeHighlight ? '#FFFFFF' : (dark ? '#FFFFFF' : '#1D1D1F');
        c.font = '800 29px Inter, sans-serif';

        if (subtitle) {

          c.font = '600 21px Inter, sans-serif';
          c.fillText(subtitle, x + 72, 24);
        }

        c.restore();
      }

      // ON-TOP Animated Equalizer Bars Pill
      function drawEqualizerPill(c, cx, cy, ms, dark, alpha) {
        c.save();
        c.globalAlpha = alpha;
        const pw = 480;
        const ph = 84;
        roundRect(c, cx - pw / 2, cy - ph / 2, pw, ph, 42);
        c.fillStyle = dark ? 'rgba(20,20,28,0.88)' : 'rgba(255,255,255,0.92)';
        c.fill();
        c.lineWidth = 2;
        c.strokeStyle = dark ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.06)';
        c.stroke();

        const count = 20;
        const startX = cx - ((count - 1) * 19) / 2;
        for (let i = 0; i < count; i++) {
          const wave = Math.abs(Math.sin(ms * 0.01 + i * 0.6)) * 0.68 + Math.abs(Math.cos(ms * 0.0065 - i * 0.35)) * 0.32;
          const bh = 12 + wave * 38;
          roundRect(c, startX + i * 19 - 3.5, cy - bh / 2, 7, bh, 3.5);
          c.fillStyle = i % 3 === 0 ? '#FF5436' : (dark ? '#FF8A6E' : '#25529B');
          c.fill();
        }
        c.restore();
      }

      // =========================================================================
      // 5. 30-SECOND 6-ACT COLOR PSYCHOLOGY STORYBOARD RENDERER
      // =========================================================================
      function renderFrame(ms) {
        const clampedMs = Math.max(0, Math.min(TOTAL_DURATION - 0.01, ms));
        const actIdx = Math.floor(clampedMs / ACT_DURATION);
        const localMs = clampedMs % ACT_DURATION;
        const t = localMs / ACT_DURATION; // 0 -> 1 inside current 5s act

        // Apple Keynote Smooth Entrance (0 -> 0.22) & Gentle Dissolve Exit (0.88 -> 1.0)
        const enter = appleKeynoteEase(Math.min(t / 0.22, 1));
        const spring = appleSpring(Math.min(t / 0.28, 1));
        const exit = t > 0.88 ? 1 - appleKeynoteEase((t - 0.88) / 0.12) : 1;
        const alpha = Math.min(enter, exit);

        const isDarkAct = (actIdx === 3); // Act 4 Pattern Interrupt in Obsidian Chrome

        // 1. Psychological Background Stage
        if (isDarkAct) {
          const bg = ctx.createRadialGradient(W / 2, H * 0.32, 60, W / 2, H / 2, H * 0.85);
          bg.addColorStop(0, '#260C09');
          bg.addColorStop(0.55, '#07070A');
          bg.addColorStop(1, '#040406');
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, W, H);
        } else {

          ctx.fillStyle = coralAura;

          const cobaltAura = ctx.createRadialGradient(840 - breathe, 1460, 20, 840 - breathe, 1460, 520);
          cobaltAura.addColorStop(0, 'rgba(37, 82, 155, 0.11)');
          cobaltAura.addColorStop(1, 'rgba(37, 82, 155, 0)');
          ctx.fillStyle = cobaltAura;

          ctx.textAlign = 'center';

          // Front Hero Phone (Screenshot 4 - Synced Lyrics)
          drawPhoneMockup(ctx, getShot(3), {
            cx: 400 - (1 - spring) * 80,
            cy: 950,
            width: 530,
            height: 1140,
            tiltDeg: -5,
            scale: 1,
            alpha,
            darkBezel: true,
            glare: t
          });

          // ON-TOP Floating Lyric Highlight Pill
          drawGlassPill(ctx, {
            cx: W / 2,
            cy: 440,
            title: 'Synced Native & Romanized Lyrics',
            subtitle: 'Word-by-Word Real-Time Timing',
            accent: '#FF5436',
            dark: true,
            alpha: appleKeynoteEase(Math.max(0, Math.min(1, (t - 0.1) / 0.2))) * exit,
            offsetY: (1 - spring) * -28
          });

          // ON-TOP Zero Ads Badge
          drawGlassPill(ctx, {
            cx: 660,
            cy: 1475,
            title: 'Zero Ads · Zero Trackers',
            subtitle: '100% Pure Uninterrupted Stream',
            accent: '#25529B',
            dark: true,
            alpha: appleKeynoteEase(Math.max(0, Math.min(1, (t - 0.22) / 0.2))) * exit,
            offsetY: (1 - spring) * 28
          });

          // ON-TOP Glowing Waveform Visualizer
          drawEqualizerPill(ctx, W / 2, 1690, ms, true, alpha);
        }

        // =====================================================================
        // ACT 5 (20s–25s): "CUSTOM ICONS & OFFLINE" — LUMINOUS DAYLIGHT PEARL
        // =====================================================================
        else if (actIdx === 4) {
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.textAlign = 'center';
          ctx.fillStyle = '#25529B';
          ctx.font = '800 28px Inter, sans-serif';
          ctx.fillText('PERSONALIZED & READY OFFLINE', W / 2, 175);

          ctx.fillStyle = '#1D1D1F';
          ctx.font = '900 82px Inter, sans-serif';
          ctx.fillText('6 Icons · Offline Hub.', W / 2, 268);
          ctx.restore();

          // Left Phone (Screenshot 6 - App Icons)
          drawPhoneMockup(ctx, getShot(5), {
            cx: 365,
            cy: 955 + (1 - spring) * 65,
            width: 500,
            height: 1080,
            tiltDeg: -5.5,
            scale: 0.96,
            alpha,
            darkBezel: false,
            glare: t
          });

          // Right Phone (Screenshot 7 - Library Offline Hub)
          drawPhoneMockup(ctx, getShot(6), {
            cx: 715,
            cy: 925 - (1 - spring) * 65,
            width: 500,
            height: 1080,
            tiltDeg: 5.5,
            scale: 0.98,
            alpha,
            darkBezel: false,
            glare: 1 - t
          });

          // ON-TOP Icon Preset Pills with Gentle 3D Tilt
          const presets = [
            { name: 'Veyraq Classic', dot: '#FF5436', x: 220, tilt: -3 },
            { name: 'Crimson Beat', dot: '#D92B1C', x: 540, tilt: 0 },
            { name: 'Midnight Cyber', dot: '#25529B', x: 860, tilt: 3 }
          ];

          presets.forEach((pr, idx) => {
            const pAlpha = appleKeynoteEase(Math.max(0, Math.min(1, (t - 0.12 - idx * 0.08) / 0.2))) * exit;
            ctx.save();
            ctx.globalAlpha = pAlpha;
            ctx.translate(pr.x, 1590 + Math.sin(ms * 0.004 + idx) * 6);
            ctx.rotate((pr.tilt * Math.PI) / 180);

            const pw = 290;
            const ph = 78;
            ctx.save();
            ctx.shadowColor = 'rgba(29,29,31,0.12)';
            ctx.shadowBlur = 24;
            ctx.shadowOffsetY = 10;
            roundRect(ctx, -pw / 2, -ph / 2, pw, ph, 39);
            ctx.fillStyle = 'rgba(255,255,255,0.95)';
            ctx.fill();
            ctx.restore();

            roundRect(ctx, -pw / 2, -ph / 2, pw, ph, 39);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(0,0,0,0.06)';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(-pw / 2 + 36, 0, 12, 0, Math.PI * 2);
            ctx.fillStyle = pr.dot;
            ctx.fill();

            ctx.fillStyle = '#1D1D1F';
            ctx.font = '800 24px Inter, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(pr.name, -pw / 2 + 60, 8);
            ctx.restore();
          });
        }

        // =====================================================================
        // ACT 6 (25s–30s): "THE CALL TO ACTION" — APPLE KEYNOTE GRAND FINALE
        // =====================================================================
        else {
          for (let r = 0; r < 2; r++) {
            const rt = (t * 1.1 + r * 0.5) % 1;
            ctx.save();
            ctx.beginPath();
            ctx.arc(W / 2, 540, 155 + rt * 320, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 84, 54, ${(1 - rt) * 0.25 * alpha})`;
            ctx.lineWidth = 3.5;
            ctx.stroke();
            ctx.restore();
          }

          drawVeyraqEmblem(ctx, W / 2, 540, 295 * spring, ms, (t * 1.6) % 1);

          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.textAlign = 'center';

          ctx.fillStyle = '#1D1D1F';
          ctx.font = '900 98px Inter, sans-serif';
          ctx.fillText('Download Veyraq', W / 2, 855 + (1 - enter) * 28);

          ctx.fillStyle = '#FF5436';
          ctx.font = '900 98px Inter, sans-serif';
          ctx.fillText('Free.', W / 2, 965 + (1 - enter) * 34);

          ctx.fillStyle = '#6E6E73';
          ctx.font = '700 35px Inter, sans-serif';
          ctx.fillText('Made by Tafeem (@AbdulTafeem)', W / 2, 1060);

          // High-Converting Dopamine Coral CTA Pill
          const ctaW = 880;
          const ctaH = 186;
          const cx = (W - ctaW) / 2;
          const cy = 1175 + (1 - spring) * 36;

          ctx.save();
          ctx.shadowColor = 'rgba(255, 84, 54, 0.38)';
          ctx.shadowBlur = 46;
          ctx.shadowOffsetY = 18;
          roundRect(ctx, cx, cy, ctaW, ctaH, 48);
          const ctaGrad = ctx.createLinearGradient(cx, cy, cx + ctaW, cy + ctaH);
          ctaGrad.addColorStop(0, '#FF684D');
          ctaGrad.addColorStop(0.55, '#FF5436');
          ctaGrad.addColorStop(1, '#D92B1C');
          ctx.fillStyle = ctaGrad;
          ctx.fill();
          ctx.restore();

          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.font = '800 26px Inter, sans-serif';
          ctx.fillText('OFFICIAL RELEASE · DIRECT ARM64 APK (9.14 MB)', W / 2, cy + 68);

          ctx.fillStyle = '#FFFFFF';
          ctx.font = '900 38px Inter, sans-serif';
          ctx.fillText('abdultafeem.github.io/Veyraq-Releases', W / 2, cy + 132);

          // Subtle Link-in-Bio Prompt
          const floatUp = Math.sin(ms * 0.007) * 8;
          ctx.fillStyle = '#25529B';
          ctx.font = '800 30px Inter, sans-serif';
          ctx.fillText('↑  TAP LINK IN BIO · INSTANT INSTALL  ↑', W / 2, 1510 + floatUp);
          ctx.restore();
        }

        // =====================================================================
        // 6. TOP INSTAGRAM STORIES 6-ACT PROGRESS SEGMENTS (ALWAYS ON TOP)
        // =====================================================================
        const padX = 36;
        const gap = 12;
        const segW = (W - padX * 2 - gap * (TOTAL_ACTS - 1)) / TOTAL_ACTS;
        for (let i = 0; i < TOTAL_ACTS; i++) {
          const sx = padX + i * (segW + gap);
          roundRect(ctx, sx, 40, segW, 8, 4);
          ctx.fillStyle = isDarkAct ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.12)';
          ctx.fill();

          const fillRatio = i < actIdx ? 1 : (i === actIdx ? t : 0);
          if (fillRatio > 0) {
            roundRect(ctx, sx, 40, segW * fillRatio, 8, 4);
            ctx.fillStyle = '#FF5436';
            ctx.fill();
          }
        }

        // Sync HUD Scrubber & Act Pills when not exporting
        if (!isExporting) {
          scrubberEl.value = Math.round(clampedMs);
          timeDisplayEl.textContent = `${(clampedMs / 1000).toFixed(1).padStart(4, '0')}s / 30.0s`;
          actNameEl.textContent = ACT_LABELS[actIdx];
          document.querySelectorAll('.act-pill').forEach((p, idx) => {
            p.classList.toggle('active', idx === actIdx);
          });
        }
      }

      // =========================================================================
      // 6. 60FPS / 120HZ ANIMATION LOOP & TIMELINE SCRUBBER
      // =========================================================================
      const scrubberEl = document.getElementById('timeline-scrubber');
      const timeDisplayEl = document.getElementById('time-display');
      const actNameEl = document.getElementById('act-name-display');
      const btnPlay = document.getElementById('btn-play');

      function loop(now) {
        const dt = now - lastNow;
        lastNow = now;
        if (isPlaying && !isExporting) {
          elapsed = (elapsed + dt) % TOTAL_DURATION;
          renderFrame(elapsed);
        }
        requestAnimationFrame(loop);
      }
      renderFrame(0);
      requestAnimationFrame(loop);

      scrubberEl.addEventListener('input', (e) => {
        elapsed = Number(e.target.value);
        renderFrame(elapsed);
      });

      btnPlay.addEventListener('click', () => {
        isPlaying = !isPlaying;
        btnPlay.textContent = isPlaying ? '❚❚ Pause' : '▶ Play';
      });

      document.getElementById('btn-restart').addEventListener('click', () => {
        elapsed = 0;
        isPlaying = true;
        btnPlay.textContent = '❚❚ Pause';
        renderFrame(0);
      });

      document.querySelectorAll('.act-pill').forEach((pill) => {
        pill.addEventListener('click', () => {
          const act = Number(pill.dataset.act);
          elapsed = act * ACT_DURATION + 40;
          renderFrame(elapsed);
        });
      });

      function toggleHud() {
        document.body.classList.toggle('clean-mode');
        if (document.body.classList.contains('clean-mode')) {
          showToast('HUD Hidden · Press H to restore controls');
        }
      }
      document.getElementById('btn-hide').addEventListener('click', toggleHud);
      window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'h') toggleHud();
        if (e.code === 'Space') {
          e.preventDefault();
          btnPlay.click();
        }
      });

      // =========================================================================
      // 7. WEBAUDIO LUSH HARMONIC MAJ9 SYNTH PAD (SYNCED TO ACTS)
      // =========================================================================
      let audioCtx = null;
      let masterGain = null;
      let streamDest = null;
      let synthOn = true;
      let lastActPlayed = -1;

      function initAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = 0.24;
          streamDest = audioCtx.createMediaStreamDestination();
          masterGain.connect(audioCtx.destination);
          masterGain.connect(streamDest);
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }

      // Lush Maj9 Chord Progression per Act (Fmaj9 -> Em7 -> Dm9 -> Cmaj9 -> Am9 -> G13sus4)
      const ACT_CHORDS = [
        [174.61, 220.00, 261.63, 329.63, 392.00], // Act 1: Fmaj9 (Warm Uplift)
        [164.81, 196.00, 246.94, 293.66, 392.00], // Act 2: Em7 (Editorial Poise)
        [146.83, 174.61, 220.00, 261.63, 329.63], // Act 3: Dm9 (Creative Flow)
        [130.81, 196.00, 246.94, 293.66, 329.63], // Act 4: Cmaj9 (Deep Focus)
        [220.00, 261.63, 329.63, 392.00, 493.88], // Act 5: Am9 (Luminous Pearl)
        [196.00, 261.63, 329.63, 392.00, 440.00]  // Act 6: G13sus4 -> Resolution
      ];

      function playMaj9Pad(actIdx) {
        if (!audioCtx || !synthOn) return;
        const now = audioCtx.currentTime;
        const freqs = ACT_CHORDS[actIdx % ACT_CHORDS.length];

        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const filter = audioCtx.createBiquadFilter();
          const gain = audioCtx.createGain();

          osc.type = i === 0 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(f, now);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(950, now);
          filter.frequency.exponentialRampToValueAtTime(1600, now + 2.2);

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.065 / (i * 0.25 + 1), now + 0.85);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 4.85);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(masterGain);

          osc.start(now + i * 0.06);
          osc.stop(now + 4.95);
        });
      }

      setInterval(() => {
        if ((isPlaying || isExporting) && synthOn && audioCtx) {
          const currentAct = Math.floor(elapsed / ACT_DURATION) % TOTAL_ACTS;
          if (currentAct !== lastActPlayed) {
            lastActPlayed = currentAct;
            playMaj9Pad(currentAct);
          }
        }
      }, 150);

      window.addEventListener('pointerdown', () => {
        if (synthOn) initAudio();
      }, { once: true });

      const btnSynth = document.getElementById('btn-synth');
      btnSynth.addEventListener('click', () => {
        synthOn = !synthOn;
        if (synthOn) {
          initAudio();
          lastActPlayed = -1;
        }
        btnSynth.textContent = synthOn ? '♪ Maj9 Synth: On' : '♪ Maj9 Synth: Off';
      });

      // =========================================================================
      // 8. 30-SECOND 1080x1920 60FPS .WEBM VIDEO EXPORTER
      // =========================================================================
      const btnExport = document.getElementById('btn-export');
      const exportOverlay = document.getElementById('export-overlay');
      const exportFill = document.getElementById('export-fill');
      const exportPct = document.getElementById('export-pct');

      btnExport.addEventListener('click', () => {
        if (!window.MediaRecorder) {
          showToast('Use Hide HUD (H) + Win+Alt+R to screen-record on this browser');
          return;
        }

        if (synthOn) initAudio();
        lastActPlayed = -1;
        isExporting = true;
        btnExport.disabled = true;
        exportOverlay.classList.add('visible');
        exportFill.style.width = '0%';
        exportPct.textContent = '0%';

        const videoStream = canvas.captureStream(60);
        const tracks = [...videoStream.getVideoTracks()];
        if (streamDest && synthOn) {
          tracks.push(...streamDest.stream.getAudioTracks());
        }
        const combined = new MediaStream(tracks);

        const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
          ? 'video/webm;codecs=vp9,opus'
          : (MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ? 'video/webm;codecs=vp8' : 'video/webm');

        const recorder = new MediaRecorder(combined, {
          mimeType,
          videoBitsPerSecond: 14000000 // 14 Mbps Studio Mastering Bitrate
        });

        const chunks = [];
        recorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) chunks.push(e.data);
        };

        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: mimeType });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'Veyraq-Apple-Keynote-Reel-30s-1080x1920.webm';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          isExporting = false;
          btnExport.disabled = false;
          exportOverlay.classList.remove('visible');
          lastNow = performance.now();
          showToast('Export Complete! Saved 30s 1080×1920 Video (.webm)');
        };

        recorder.start(100);
        const startMs = performance.now();

        function renderExportTick(now) {
          const dt = now - startMs;
          elapsed = Math.min(dt, TOTAL_DURATION - 1);
          const pct = Math.min(100, Math.round((dt / TOTAL_DURATION) * 100));
          exportFill.style.width = `${pct}%`;
          exportPct.textContent = `${pct}%`;

          renderFrame(elapsed);

          if (dt < TOTAL_DURATION) {
            requestAnimationFrame(renderExportTick);
          } else {
            recorder.stop();
          }
        }
        requestAnimationFrame(renderExportTick);
      });
    })();
  </script>
</body>
